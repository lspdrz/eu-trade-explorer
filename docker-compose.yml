services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: eu_trade_explorer
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: eu_trade_explorer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eu_trade_explorer"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
